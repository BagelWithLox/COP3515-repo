services:

  development:

    container_name: university-programming-environment

    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile

    volumes:

      # Mount the student's repository into the container
      - ..:/workspace:cached

    working_dir: /workspace

    user: student

    environment:

      # Prevent Rust from prompting during builds
      - CARGO_TERM_COLOR=always

      # Make compiler output easier to read
      - TERM=xterm-256color

    stdin_open: true

    tty: true

    command: sleep infinity